<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6f8" />
    <script>
      (() => {
        let theme = 'light'
        try {
          const saved = localStorage.getItem('demoscope-theme')
          if (saved === 'dark' || saved === 'light') theme = saved
        } catch (_) {
          // Keep the light default if WebKit storage is unavailable.
        }
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', theme === 'dark' ? '#15181d' : '#f4f6f8')
      })()
    </script>
    <style>
      html, body, #app { background: #f4f6f8; }
      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html[data-theme="dark"] #app { background: #15181d; }
    </style>
    <title>DemoScope — CS 1.6 Demo Inspector</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
